name: Verify MathMate
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.lock.txt
      - run: python -m pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mathmate
          POSTGRES_PASSWORD: ci-test-only-password
          POSTGRES_DB: mathmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mathmate -d mathmate_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.lock.txt
      - run: python -m pytest tests/test_postgres.py -q
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://mathmate:ci-test-only-password@localhost:5432/mathmate_test
